name: Build Echo APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zlib1g-dev \
            openjdk-17-jdk autoconf automake libtool \
            pkg-config libncurses5-dev libtinfo5 \
            zip unzip

      - name: Force Java 17
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          java -version

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0
          pip install kivy==2.3.1
          pip install buildozer==1.6.0

      - name: Prepare APK project
        run: |
          mkdir -p apk_project/data apk_project/assets
          cp oneri.py apk_project/oneri.py
          cp data/recommender.db apk_project/data/recommender.db

      - name: Create icon
        run: |
          python3 -c "
          import struct, zlib
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          sig = b'\x89PNG\r\n\x1a\n'
          ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 512, 512, 8, 2, 0, 0, 0))
          raw = b''
          for y in range(512):
              raw += b'\x00' + bytes([10, 10, 15]) * 512
          idat = chunk(b'IDAT', zlib.compress(raw))
          iend = chunk(b'IEND', b'')
          d = sig + ihdr + idat + iend
          with open('apk_project/assets/icon.png', 'wb') as f: f.write(d)
          with open('apk_project/assets/presplash.png', 'wb') as f: f.write(d)
          print('Icons OK')
          "

      - name: Create buildozer.spec
        run: |
          cat > apk_project/buildozer.spec << 'EOF'
          [app]
          title = Echo
          package.name = echo.anime
          package.domain = com.echo.anime
          source.dir = .
          source.include_exts = py,png,jpg,db,json,txt
          version = 5.2.0
          requirements = python3,kivy==2.3.1,android,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE
          android.api = 34
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          presplash.filename = assets/presplash.png
          icon.filename = assets/icon.png
          log_level = 2
          warn_on_root = 1
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Create main.py
        run: |
          cat > apk_project/main.py << 'PYEOF'
          import os, sys, time, threading
          APP_DIR = os.path.dirname(os.path.abspath(__file__))
          WEB_PORT = 8765
          os.environ['KIVY_LOG_LEVEL'] = 'warning'
          from kivy.app import App
          from kivy.config import Config
          from kivy.core.window import Window
          from kivy.clock import Clock
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.progressbar import ProgressBar
          Config.set('graphics', 'width', '360')
          Config.set('graphics', 'height', '640')
          Config.set('graphics', 'resizable', False)
          class EchoApp(App):
              def build(self):
                  self.title = "Echo"
                  Window.clearcolor = (0.07, 0.07, 0.07, 1)
                  root = BoxLayout(orientation='vertical')
                  nav = BoxLayout(size_hint_y=None, height=56, padding=8)
                  nav.add_widget(Label(text="ECHO", font_size=20, color=(0.5, 0.85, 0.85, 1), bold=True, size_hint_x=0.7))
                  root.add_widget(nav)
                  loading = BoxLayout(orientation='vertical', padding=40, spacing=20)
                  status = Label(text="The Wired is everywhere...", font_size=18, color=(0.5, 0.85, 0.85, 1), halign='center')
                  loading.add_widget(status)
                  pb = ProgressBar(max=100, value=0, size_hint_y=None, height=6)
                  loading.add_widget(pb)
                  root.add_widget(loading)
                  def start_server(dt):
                      try:
                          sys.path.insert(0, APP_DIR)
                          from oneri import start_web_server
                          t = threading.Thread(target=start_web_server, args=(WEB_PORT,), daemon=True)
                          t.start()
                      except: pass
                  def check_server(dt):
                      pb.value += 25
                      if pb.value >= 100:
                          try:
                              root.remove_widget(loading)
                              from jnius import autoclass
                              WebView = autoclass('android.webkit.WebView')
                              activity = autoclass('org.kivy.android.PythonActivity').mActivity
                              wv = WebView(activity)
                              wv.getSettings().setJavaScriptEnabled(True)
                              wv.loadUrl(f"http://127.0.0.1:{WEB_PORT}/")
                              activity.setContentView(wv)
                          except:
                              root.add_widget(Label(text=f"Server: http://127.0.0.1:{WEB_PORT}/", font_size=14, color=(0.5, 0.85, 0.85, 1)))
                          return False
                  Clock.schedule_once(start_server, 0)
                  Clock.schedule_interval(check_server, 1)
                  return root
              def on_pause(self):
                  return True
          if __name__ == "__main__":
              EchoApp().run()
          PYEOF

      - name: Build APK
        working-directory: ./apk_project
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "=== Java ==="
          java -version
          echo "=== Python ==="
          python3 --version
          echo "=== Buildozer ==="
          buildozer version
          echo "=== Starting build ==="
          yes | buildozer -v android debug 2>&1 | tee /tmp/build.log
          echo "=== BUILD EXIT: $? ==="

      - name: Find APK
        if: always()
        run: |
          mkdir -p apk_output
          find / -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "FOUND: $f"
            cp "$f" apk_output/
          done
          echo "=== APKs ==="
          ls -la apk_output/ 2>/dev/null || echo "NO APK"
          echo "=== Build log tail ==="
          tail -80 /tmp/build.log 2>/dev/null

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-apk
          path: apk_output/*.apk
          retention-days: 30
          if-no-files-found: warn
