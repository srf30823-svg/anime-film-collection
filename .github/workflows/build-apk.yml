name: Build Echo APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zlib1g-dev \
            openjdk-17-jdk autoconf automake libtool \
            pkg-config libncurses5-dev libtinfo5

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Prepare APK project
        run: |
          mkdir -p apk_project/data apk_project/assets
          cp anime-project/oneri.py apk_project/oneri.py
          cp -r anime-project/data/* apk_project/data/
          ls -la apk_project/data/

      - name: Create icon
        run: |
          python3 << 'ICONEOF'
          import struct, zlib
          def create_png(width, height, color):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  crc = struct.pack('>I', zlib.crc32(c) & 0xffffffff)
                  return struct.pack('>I', len(data)) + c + crc
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr_data = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              ihdr = chunk(b'IHDR', ihdr_data)
              raw = b''
              for y in range(height):
                  raw += b'\x00'
                  for x in range(width):
                      if height//3 < y < 2*height//3 and width//4 < x < 3*width//4:
                          raw += bytes([color[0]//2, color[1]//2, color[2]//2])
                      else:
                          raw += bytes(color)
              compressed = zlib.compress(raw)
              idat = chunk(b'IDAT', compressed)
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          icon_data = create_png(512, 512, (10, 10, 15))
          with open('apk_project/assets/icon.png', 'wb') as f:
              f.write(icon_data)
          with open('apk_project/assets/presplash.png', 'wb') as f:
              f.write(icon_data)
          print('Icons created')
          ICONEOF

      - name: Create buildozer.spec
        run: |
          cat > apk_project/buildozer.spec << 'SPECEOF'
          [app]
          title = Echo
          package.name = echo.anime
          package.domain = com.echo.anime
          source.dir = .
          source.include_exts = py,png,jpg,db,json,txt
          version = 5.2.0
          requirements = python3,kivy==2.3.0,android,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          presplash.filename = assets/presplash.png
          icon.filename = assets/icon.png
          log_level = 2
          warn_on_root = 1
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPECEOF

      - name: Create main.py for APK
        run: |
          cat > apk_project/main.py << 'PYEOF'
          """
          Echo - Anime & Manga Oneri Sistemi
          Kivy WebView Wrapper
          """
          import os, sys, time, threading

          APP_DIR = os.path.dirname(os.path.abspath(__file__))
          WEB_PORT = 8765

          os.environ['KIVY_LOG_LEVEL'] = 'warning'

          from kivy.app import App
          from kivy.config import Config
          from kivy.core.window import Window
          from kivy.clock import Clock
          from kivy.properties import StringProperty, BooleanProperty
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.progressbar import ProgressBar

          Config.set('graphics', 'width', '360')
          Config.set('graphics', 'height', '640')
          Config.set('graphics', 'resizable', False)

          COLORS = {
              'bg': (0.07, 0.07, 0.07, 1),
              'ice': (0.5, 0.85, 0.85, 1),
              'neon': (0.3, 0.93, 0.92, 1),
              'muted': (0.53, 0.53, 0.53, 1),
          }

          class EchoApp(App):
              server_status = StringProperty("Baslatiliyor...")
              is_ready = BooleanProperty(False)

              def build(self):
                  self.title = "Echo"
                  Window.clearcolor = COLORS['bg']
                  root = BoxLayout(orientation='vertical')
                  root.add_widget(self._build_nav())
                  self.loading = BoxLayout(orientation='vertical', padding=40, spacing=20)
                  self.status_label = Label(text="The Wired is everywhere...", font_size=18, color=COLORS['ice'], halign='center')
                  self.loading.add_widget(self.status_label)
                  self.pb = ProgressBar(max=100, value=0, size_hint_y=None, height=6)
                  self.loading.add_widget(self.pb)
                  root.add_widget(self.loading)
                  Clock.schedule_once(self._start_server, 0)
                  Clock.schedule_interval(self._check_server, 1)
                  return root

              def _build_nav(self):
                  nav = BoxLayout(size_hint_y=None, height=56, padding=8)
                  nav.add_widget(Label(text="ECHO", font_size=20, color=COLORS['ice'], bold=True, size_hint_x=0.7))
                  self.status_dot = Label(text="o", font_size=14, color=COLORS['muted'], size_hint_x=0.3)
                  nav.add_widget(self.status_dot)
                  return nav

              def _start_server(self, dt):
                  try:
                      sys.path.insert(0, APP_DIR)
                      from oneri import start_web_server
                      t = threading.Thread(target=start_web_server, args=(WEB_PORT,), daemon=True)
                      t.start()
                      self.server_status = "OK"
                  except Exception as e:
                      self.server_status = str(e)

              def _check_server(self, dt):
                  self.pb.value += 20
                  if self.pb.value >= 100:
                      self._load_webview()
                      return False

              def _load_webview(self):
                  try:
                      self.root.remove_widget(self.loading)
                      self.status_dot.color = COLORS['neon']
                      # Use pyjnius to create Android WebView
                      try:
                          from jnius import autoclass
                          WebView = autoclass('android.webkit.WebView')
                          WebSettings = autoclass('android.webkit.WebSettings')
                          activity = autoclass('org.kivy.android.PythonActivity').mActivity
                          webview = WebView(activity)
                          webview.getSettings().setJavaScriptEnabled(True)
                          webview.getSettings().setDomStorageEnabled(True)
                          webview.loadUrl(f"http://127.0.0.1:{WEB_PORT}/")
                          # Add WebView to activity
                          activity.setContentView(webview)
                      except Exception as e:
                          # Fallback: try kivy webview
                          try:
                              from kivy.uix.webview import WebView as KVWebView
                              wv = KVWebView(url=f"http://127.0.0.1:{WEB_PORT}/", enable_javascript=True, enable_zoom=False)
                              self.root.add_widget(wv)
                          except:
                              self.status_label.text = f"WebView error: {e}"
                              self.root.add_widget(self.status_label)
                  except Exception as e:
                      self.status_label.text = str(e)

              def on_pause(self):
                  return True

              def on_resume(self):
                  pass

          if __name__ == "__main__":
              EchoApp().run()
          PYEOF

      - name: Build APK
        working-directory: ./apk_project
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          buildozer version
          yes | buildozer -v android debug 2>&1 | tee /tmp/build.log
          echo "=== BUILD EXIT CODE: $? ==="

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== bin/ contents ==="
          ls -la apk_project/bin/ 2>/dev/null || echo "No bin/"
          echo "=== .buildozer dists ==="
          find apk_project -path "*/dists/*" -name "*.apk" -type f 2>/dev/null
          echo "=== Last 50 lines of build log ==="
          tail -50 /tmp/build.log 2>/dev/null || echo "No build log"

      - name: Copy APK to output
        if: always()
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/ \;
          echo "=== APK output ==="
          ls -la apk_output/ 2>/dev/null || echo "NO APK FOUND"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-apk
          path: apk_output/*.apk
          retention-days: 30
