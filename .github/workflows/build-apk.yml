name: Build Echo APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zlib1g-dev \
            openjdk-17-jdk autoconf automake libtool \
            pkg-config libncurses5-dev libtinfo5 \
            zip unzip

      - name: Force Java 17
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          java -version

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0
          pip install kivy==2.3.1
          pip install buildozer==1.6.0

      - name: Prepare APK project
        run: |
          mkdir -p apk_project/data apk_project/assets apk_project/fonts
          # Ana modül
          cp oneri.py apk_project/oneri.py
          # Veritabanı
          cp data/recommender.db apk_project/data/recommender.db
          # main.py (güncel)
          cp hermes-apk/main.py apk_project/main.py
          # buildozer.spec (güncel)
          cp hermes-apk/buildozer.spec apk_project/buildozer.spec

      - name: Create icon
        run: |
          python3 -c "
          import struct, zlib
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          sig = b'\x89PNG\r\n\x1a\n'
          # 512x512 mor gradient icon
          raw = b''
          for y in range(512):
              raw += b'\x00'
              for x in range(512):
                  r = int(10 + (y/512) * 30)
                  g = int(10 + (x/512) * 20)
                  b = int(15 + ((x+y)/1024) * 60)
                  raw += bytes([r, g, b])
          ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 512, 512, 8, 2, 0, 0, 0))
          idat = chunk(b'IDAT', zlib.compress(raw, 9))
          iend = chunk(b'IEND', b'')
          d = sig + ihdr + idat + iend
          with open('apk_project/assets/icon.png', 'wb') as f: f.write(d)
          with open('apk_project/assets/presplash.png', 'wb') as f: f.write(d)
          print('Icons OK')
          "

      - name: Build APK
        working-directory: ./apk_project
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "=== Java ==="
          java -version
          echo "=== Python ==="
          python3 --version
          echo "=== Buildozer ==="
          buildozer version
          echo "=== Starting build ==="
          yes | buildozer -v android debug 2>&1 | tee /tmp/build.log
          echo "=== BUILD EXIT: $? ==="

      - name: Find APK
        if: always()
        run: |
          mkdir -p apk_output
          find /home/runner -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "FOUND: $f"
            cp "$f" apk_output/
          done
          echo "=== APKs ==="
          ls -la apk_output/ 2>/dev/null || echo "NO APK"
          echo "=== Build log tail ==="
          tail -100 /tmp/build.log 2>/dev/null

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-apk-v5.3
          path: apk_output/*.apk
          retention-days: 30
          if-no-files-found: warn
